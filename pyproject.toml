[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "looplab"
version = "0.2.0"
description = "LoopLab — Hermes-native loop engineering lab (spec, validate, score, dry-run, skills)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LoopLab" }]
dependencies = [
  "PyYAML>=6.0",
]
keywords = ["hermes", "loop-engineering", "ai-agents", "agent-harness"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
looplab = "looplab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["looplab*"]

[tool.setuptools.package-data]
looplab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
